<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3年前期試験 過去問 ポータル</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
        <!-- Header -->
        <header class="bg-gradient-to-r from-slate-800 to-indigo-900 text-white p-6">
            <h1 class="text-2xl font-bold">前期試験 過去問系統樹ポータル</h1>
            <p class="text-slate-300 text-sm mt-1">科目別インデックス</p>
        </header>

        <!-- Main Content -->
        <main class="p-6">
            <div id="subjectList" class="space-y-3">
                <!-- Dynamically rendered via JS -->
            </div>
            <a href="https://github.com/gobousei/2026-zenki/">CSVファイルのダウンロード</a>
        </main>
    </div>

    <script>
        // =========================================================
        // 科目設定配列（表示名, パス）
        // 追加・編集はここだけに [表示名, パス] の形式で記述します。
        // =========================================================
        const subjects = [
            ["染色体医工学", "ChromosomalMedicalEngineering.html"],
            ["外科学概論", "Surgeryintroduction.html"],
            ["老年医学","geriatrics.html"],
            ["内科学概論","IntroductiontoInternalMedicine.html"],
            ["周産期医学","PerinatalMedicine.html"],
            ["遺伝子制御学","GeneRegulation.html"]
            // ["科目名", "ファイル名.html"],  <-- このように追加していくだけです
        ];

        function renderSubjects() {
            const listContainer = document.getElementById('subjectList');
            listContainer.innerHTML = '';

            subjects.forEach(([name, path]) => {
                const itemHTML = `
                    <a href="${path}" class="group flex items-center justify-between p-4 rounded-lg border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition duration-150">
                        <div class="flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 group-hover:scale-125 transition-transform"></span>
                            <span class="font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">${name}</span>
                        </div>
                        <span class="text-xs font-mono text-slate-400 group-hover:text-indigo-500">${path}</span>
                    </a>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        renderSubjects();
    </script>
</body>
</html>
